name: Update Luogu Problem Catalog

on:
  workflow_dispatch:
    inputs:
      max_pages:
        description: "Maximum Luogu list pages to crawl"
        required: false
        default: "200"
      delay_ms:
        description: "Delay between requests in milliseconds"
        required: false
        default: "1500"
  schedule:
    - cron: "18 20 * * 6"

permissions:
  contents: write

jobs:
  update-luogu-catalog:
    runs-on: ubuntu-latest
    env:
      MAX_PAGES: ${{ github.event.inputs.max_pages || '200' }}
      DELAY_MS: ${{ github.event.inputs.delay_ms || '1500' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.8.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Crawl Luogu problem metadata
        run: >-
          pnpm exec tsx scripts/problem-bank/crawl-luogu-problem-list.ts
          --max-pages "$MAX_PAGES"
          --delay-ms "$DELAY_MS"
          --output data/problem-bank/luogu_problem_catalog.json

      - name: Commit catalog changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/problem-bank/luogu_problem_catalog.json
          if git diff --cached --quiet; then
            echo "No catalog changes."
          else
            git commit -m "data: update Luogu problem catalog"
            git push
          fi
